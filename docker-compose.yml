version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: podlaunch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: podlaunch_user
      POSTGRES_PASSWORD: podlaunch_secret
      POSTGRES_DB: podlaunch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podlaunch_user -d podlaunch_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: podlaunch-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: podlaunch_user
      POSTGRES_PASSWORD: podlaunch_secret
      POSTGRES_DB: podlaunch_db
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    image: node:18-alpine
    container_name: podlaunch-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
